  <text x="190" y="550" font-size="15" font-weight="700" fill="#f0f2f5" text-anchor="middle">4</text>
  <rect x="222" y="531" width="96" height="26" rx="13" fill="none" stroke="#f85149"/>
  <text x="270" y="549" font-size="12.5" font-weight="700" fill="#f85149" text-anchor="middle">REJECT</text>
  <text x="380" y="542" font-size="20" font-weight="700" fill="#f0f2f5" text-anchor="start">LAN net → any</text>
  <text x="380" y="563" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="start">TCP/UDP · port 53</text>
  <text x="1350" y="551" font-size="16" font-weight="400" fill="#9aa1ab" text-anchor="end">Refus des DNS externes</text>
  <text x="150" y="614" font-size="14" font-weight="700" fill="#9aa1ab" text-anchor="start" letter-spacing="0.6">INTERDICTION QUI PROTÈGE</text>
  <text x="1370" y="614" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="end">avant les ouvertures : « any » inclut aussi la maison</text>
  <rect x="150" y="626" width="1220" height="60" rx="10" fill="#23262b" stroke="#3a3f47"/>
  <rect x="150" y="626" width="5" height="60" fill="#f85149"/>
