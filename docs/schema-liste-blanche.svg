  <text x="380" y="902" font-size="20" font-weight="700" fill="#f0f2f5" text-anchor="start">LAN net → any</text>
  <text x="380" y="923" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="start">TCP · PORTS_WEB (80, 443)</text>
  <text x="1350" y="911" font-size="16" font-weight="400" fill="#9aa1ab" text-anchor="end">Web vers Internet</text>
  <text x="150" y="974" font-size="14" font-weight="700" fill="#9aa1ab" text-anchor="start" letter-spacing="0.6">NETTOYAGE</text>
  <text x="1370" y="974" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="end">journalisée : chaque refus apparaît dans la Live View</text>
