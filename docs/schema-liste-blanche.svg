  <text x="150" y="1074" font-size="15" font-weight="400" fill="#9aa1ab" text-anchor="start">Les règles « Default allow LAN to any » (IPv4 et IPv6) sont désactivées, pas supprimées : on peut les réactiver en cas de besoin.</text>
