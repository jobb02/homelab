  <text x="270" y="661" font-size="12.5" font-weight="700" fill="#f85149" text-anchor="middle">REJECT</text>
  <text x="380" y="654" font-size="20" font-weight="700" fill="#f0f2f5" text-anchor="start">LAN net → RES_MAISON</text>
  <text x="380" y="675" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="start">tous protocoles</text>
  <text x="1350" y="663" font-size="16" font-weight="400" fill="#9aa1ab" text-anchor="end">Isolation du réseau maison</text>
  <text x="150" y="726" font-size="14" font-weight="700" fill="#9aa1ab" text-anchor="start" letter-spacing="0.6">OUVERTURES GÉNÉRALES</text>
  <text x="1370" y="726" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="end">seul ce qui est prévu sort ; leur ordre entre elles est sans importance</text>
  <rect x="150" y="738" width="1220" height="60" rx="10" fill="#23262b" stroke="#3a3f47"/>
