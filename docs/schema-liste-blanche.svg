  <rect x="222" y="463" width="96" height="26" rx="13" fill="none" stroke="#3fb950"/>
  <text x="270" y="481" font-size="12.5" font-weight="700" fill="#3fb950" text-anchor="middle">PASS</text>
  <text x="380" y="474" font-size="20" font-weight="700" fill="#f0f2f5" text-anchor="start">LAN net → LAN address</text>
  <text x="380" y="495" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="start">TCP/UDP · port 53</text>
  <text x="1350" y="483" font-size="16" font-weight="400" fill="#9aa1ab" text-anchor="end">DNS uniquement via OPNsense</text>
  <rect x="150" y="514" width="1220" height="60" rx="10" fill="#23262b" stroke="#3a3f47"/>
  <rect x="150" y="514" width="5" height="60" fill="#f85149"/>
