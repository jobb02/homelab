  <text x="270" y="773" font-size="12.5" font-weight="700" fill="#3fb950" text-anchor="middle">PASS</text>
  <text x="380" y="766" font-size="20" font-weight="700" fill="#f0f2f5" text-anchor="start">LAN net → any</text>
  <text x="380" y="787" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="start">UDP · port 123</text>
  <text x="1350" y="775" font-size="16" font-weight="400" fill="#9aa1ab" text-anchor="end">Heure (NTP)</text>
