  <text x="270" y="841" font-size="12.5" font-weight="700" fill="#3fb950" text-anchor="middle">PASS</text>
  <text x="380" y="834" font-size="20" font-weight="700" fill="#f0f2f5" text-anchor="start">LAN net → any</text>
  <text x="380" y="855" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="start">ICMP · ping</text>
  <text x="1350" y="843" font-size="16" font-weight="400" fill="#9aa1ab" text-anchor="end">Ping de diagnostic</text>
  <rect x="150" y="874" width="1220" height="60" rx="10" fill="#23262b" stroke="#3a3f47"/>
