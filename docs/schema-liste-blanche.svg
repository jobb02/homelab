  <text x="190" y="302" font-size="15" font-weight="700" fill="#f0f2f5" text-anchor="middle">1</text>
  <rect x="222" y="283" width="96" height="26" rx="13" fill="none" stroke="#3fb950"/>
  <text x="270" y="301" font-size="12.5" font-weight="700" fill="#3fb950" text-anchor="middle">PASS</text>
  <text x="380" y="294" font-size="20" font-weight="700" fill="#f0f2f5" text-anchor="start">KALI → FREEBOX</text>
  <text x="380" y="315" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="start">ICMP · ping</text>
  <text x="1350" y="303" font-size="16" font-weight="400" fill="#9aa1ab" text-anchor="end">Exception de test</text>
  <rect x="150" y="334" width="1220" height="60" rx="10" fill="#23262b" stroke="#3a3f47"/>
  <rect x="150" y="334" width="5" height="60" fill="#3fb950"/>
  <circle cx="190" cy="364" r="16" fill="none" stroke="#e6e8eb" stroke-width="1.5"/>
  <text x="190" y="370" font-size="15" font-weight="700" fill="#f0f2f5" text-anchor="middle">2</text>
  <rect x="222" y="351" width="96" height="26" rx="13" fill="none" stroke="#3fb950"/>
  <text x="270" y="369" font-size="12.5" font-weight="700" fill="#3fb950" text-anchor="middle">PASS</text>
  <text x="380" y="362" font-size="20" font-weight="700" fill="#f0f2f5" text-anchor="start">LINUX_LITE → SYNOLOGY</text>
  <text x="380" y="383" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="start">TCP · port 5001</text>
  <text x="1350" y="371" font-size="16" font-weight="400" fill="#9aa1ab" text-anchor="end">Administration du NAS (DSM)</text>
  <text x="150" y="434" font-size="14" font-weight="700" fill="#9aa1ab" text-anchor="start" letter-spacing="0.6">DNS FORCÉ VIA OPNSENSE</text>
  <text x="1370" y="434" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="end">le Pass vers OPNsense passe avant le refus général</text>
  <rect x="150" y="446" width="1220" height="60" rx="10" fill="#23262b" stroke="#3a3f47"/>
  <rect x="150" y="446" width="5" height="60" fill="#3fb950"/>
  <circle cx="190" cy="476" r="16" fill="none" stroke="#e6e8eb" stroke-width="1.5"/>
