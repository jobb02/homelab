<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1108" width="1400" height="1108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e6e8eb"/></marker></defs>
  <rect width="1400" height="1108" fill="#16181c"/>
  <line x1="100" y1="162" x2="100" y2="1016" stroke="#e6e8eb" stroke-width="2"/>
  <line x1="100" y1="162" x2="148" y2="162" stroke="#e6e8eb" stroke-width="2"/>
  <text x="30" y="56" font-size="34" font-weight="700" fill="#f0f2f5" text-anchor="start">Liste blanche — règles LAN de fw-sitea</text>
  <text x="30" y="88" font-size="17" font-weight="400" fill="#9aa1ab" text-anchor="start">Lues de haut en bas : la première règle qui correspond au paquet décide, les suivantes ne sont pas lues (first match)</text>
  <rect x="150" y="120" width="1220" height="84" rx="10" fill="#23262b" stroke="#e6e8eb"/>
  <rect x="170" y="136" width="230" height="24" rx="12" fill="none" stroke="#e6e8eb"/>
  <text x="285" y="153" font-size="11.5" font-weight="700" fill="#e6e8eb" text-anchor="middle">PAQUET QUI SORT DU LAB</text>
  <text x="170" y="190" font-size="21" font-weight="700" fill="#f0f2f5" text-anchor="start">Kali 10.10.10.10 · Linux Lite 10.10.10.11</text>
  <text x="1350" y="190" font-size="15" font-weight="400" fill="#9aa1ab" text-anchor="end">entre par l'interface LAN de fw-sitea</text>
  <text x="150" y="254" font-size="14" font-weight="700" fill="#9aa1ab" text-anchor="start" letter-spacing="0.6">EXCEPTIONS PRÉCISES</text>
  <text x="1370" y="254" font-size="14" font-weight="400" fill="#9aa1ab" text-anchor="end">placées avant le Reject vers la maison, sinon jamais lues</text>
  <rect x="150" y="266" width="1220" height="60" rx="10" fill="#23262b" stroke="#3a3f47"/>
  <rect x="150" y="266" width="5" height="60" fill="#3fb950"/>
