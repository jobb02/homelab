<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1400" height="760" fill="#16181c"/>
  <text x="30" y="56" font-size="32" font-weight="700" fill="#f0f2f5">Isolation du réseau maison sur les trois sites</text>
  <text x="30" y="88" font-size="16" fill="#9aa1ab">Internet oui, réseau local de l'opérateur non · un refus explicite, placé avant l'autorisation, sur chaque pare-feu</text>

  <!-- Internet -->
  <rect x="610" y="112" width="180" height="40" rx="20" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="700" y="138" font-size="16" font-weight="700" fill="#3fb950" text-anchor="middle">Internet</text>
  <path d="M 700 152 V 180" fill="none" stroke="#3fb950" stroke-width="2.5"/>

  <!-- Réseau maison -->
  <rect x="40" y="180" width="1320" height="96" rx="12" fill="#1c1f24" stroke="#e6e8eb" stroke-width="1.5"/>
  <text x="64" y="212" font-size="15" font-weight="700" fill="#f0f2f5" letter-spacing="0.5">RÉSEAU MAISON = WAN DES TROIS PARE-FEUX</text>
  <text x="1336" y="212" font-size="15" font-weight="700" fill="#f0f2f5" text-anchor="end">RES_MAISON = 192.168.1.0/24</text>
  <text x="64" y="240" font-size="14.5" fill="#9aa1ab">Freebox .254 · NAS .117 · PC d'admin .99 · AdGuard .53 · hyperviseurs .100 et .102</text>
  <text x="64" y="263" font-size="13.5" fill="#9aa1ab">La Freebox relaie vers Internet : le pare-feu filtre sur l'adresse de destination du paquet, pas sur le routeur qui le relaie.</text>

  <!-- Liaisons WAN -->
  <path d="M 240 276 V 330" fill="none" stroke="#e6e8eb" stroke-width="2"/>
  <path d="M 700 276 V 330" fill="none" stroke="#e6e8eb" stroke-width="2"/>
  <path d="M 1160 276 V 330" fill="none" stroke="#e6e8eb" stroke-width="2"/>
  <text x="252" y="308" font-size="13" fill="#9aa1ab">WAN .29</text>
  <text x="712" y="308" font-size="13" fill="#9aa1ab">WAN .30</text>
  <text x="1172" y="308" font-size="13" fill="#9aa1ab">WAN .31</text>

  <!-- Pare-feu A -->
  <rect x="40" y="330" width="400" height="230" rx="10" fill="#23262b" stroke="#3a3f47"/>
  <text x="56" y="364" font-size="21" font-weight="700" fill="#f0f2f5">fw-sitea · OPNsense</text>
  <text x="56" y="394" font-size="14" font-weight="700" fill="#f0f2f5">Règle « isolation lab ↔ maison »</text>
  <text x="56" y="416" font-size="14" fill="#c9cdd3">Reject · LAN net → RES_MAISON</text>
  <text x="56" y="438" font-size="14" fill="#c9cdd3">avant les autorisations (NTP, ping, web)</text>
  <text x="56" y="474" font-size="15" font-weight="700" fill="#3fb950">✓ Internet</text>
  <text x="170" y="474" font-size="15" font-weight="700" fill="#f85149">✕ 192.168.1.0/24</text>
  <text x="56" y="506" font-size="13" fill="#9aa1ab">Message reçu par le poste :</text>
  <text x="56" y="528" font-size="14" fill="#f0f2f5">« Connection refused »</text>

  <!-- Pare-feu B -->
  <rect x="500" y="330" width="400" height="230" rx="10" fill="#23262b" stroke="#3a3f47"/>
  <text x="516" y="364" font-size="21" font-weight="700" fill="#f0f2f5">fw-siteb · FortiGate</text>
  <text x="516" y="394" font-size="14" font-weight="700" fill="#f0f2f5">Règle 2 « Isolation reseau maison »</text>
  <text x="516" y="416" font-size="14" fill="#c9cdd3">deny + send-deny-packet · port2 → port1</text>
  <text x="516" y="438" font-size="14" fill="#c9cdd3">move 2 before 1 (2 règles sur 3)</text>
  <text x="516" y="474" font-size="15" font-weight="700" fill="#3fb950">✓ Internet</text>
  <text x="630" y="474" font-size="15" font-weight="700" fill="#f85149">✕ 192.168.1.0/24</text>
  <text x="516" y="506" font-size="13" fill="#9aa1ab">Message reçu par le poste :</text>
  <text x="516" y="528" font-size="14" fill="#f0f2f5">« Packet filtered »</text>

  <!-- Pare-feu C -->
  <rect x="960" y="330" width="400" height="230" rx="10" fill="#23262b" stroke="#3a3f47"/>
  <text x="976" y="364" font-size="21" font-weight="700" fill="#f0f2f5">fw-sitec · Sophos</text>
  <text x="976" y="394" font-size="14" font-weight="700" fill="#f0f2f5">Règle #5 « Isolation reseau maison »</text>
  <text x="976" y="416" font-size="14" fill="#c9cdd3">Refuser · zone LAN → zone WAN, RES_MAISON</text>
  <text x="976" y="438" font-size="14" fill="#c9cdd3">en position 1, journalisée</text>
  <text x="976" y="474" font-size="15" font-weight="700" fill="#3fb950">✓ Internet</text>
  <text x="1090" y="474" font-size="15" font-weight="700" fill="#f85149">✕ 192.168.1.0/24</text>
  <text x="976" y="506" font-size="13" fill="#9aa1ab">Message reçu par le poste :</text>
  <text x="976" y="528" font-size="14" fill="#f0f2f5">« Destination Port Unreachable »</text>

  <!-- LAN -->
  <path d="M 240 560 V 600" fill="none" stroke="#e6e8eb" stroke-width="2"/>
  <path d="M 700 560 V 600" fill="none" stroke="#e6e8eb" stroke-width="2"/>
  <path d="M 1160 560 V 600" fill="none" stroke="#e6e8eb" stroke-width="2"/>
  <rect x="40" y="600" width="400" height="80" rx="12" fill="#1c1f24" stroke="#e6e8eb" stroke-width="1.5"/>
  <text x="60" y="630" font-size="15" font-weight="700" fill="#f0f2f5" letter-spacing="0.5">SITE A · SIÈGE</text>
  <text x="420" y="630" font-size="15" font-weight="700" fill="#f0f2f5" text-anchor="end">10.10.10.0/24</text>
  <text x="60" y="658" font-size="14" fill="#9aa1ab">Kali .10 · Linux Lite .11</text>
  <rect x="500" y="600" width="400" height="80" rx="12" fill="#1c1f24" stroke="#e6e8eb" stroke-width="1.5"/>
  <text x="520" y="630" font-size="15" font-weight="700" fill="#f0f2f5" letter-spacing="0.5">SITE B · AGENCE 1</text>
  <text x="880" y="630" font-size="15" font-weight="700" fill="#f0f2f5" text-anchor="end">10.20.20.0/24</text>
  <text x="520" y="658" font-size="14" fill="#9aa1ab">poste-siteb .101 (réservé) · DNS = le FortiGate</text>
  <rect x="960" y="600" width="400" height="80" rx="12" fill="#1c1f24" stroke="#e6e8eb" stroke-width="1.5"/>
  <text x="980" y="630" font-size="15" font-weight="700" fill="#f0f2f5" letter-spacing="0.5">SITE C · AGENCE 2</text>
  <text x="1340" y="630" font-size="15" font-weight="700" fill="#f0f2f5" text-anchor="end">10.30.30.0/24</text>
  <text x="980" y="658" font-size="14" fill="#9aa1ab">poste-sitec .100 (réservé) · DNS = le Sophos</text>

  <text x="40" y="722" font-size="14" fill="#c9cdd3">Même objet sur les trois pare-feux (RES_MAISON) · même logique : le refus qui protège est lu avant l'autorisation (first match).</text>
  <text x="40" y="744" font-size="13" fill="#9aa1ab">Le DNS des postes passe par leur pare-feu : une requête émise par le pare-feu lui-même n'est pas soumise aux règles LAN → WAN, le refus ne le casse donc pas.</text>
</svg>
